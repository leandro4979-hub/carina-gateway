name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run intake contract tests
        run: python -m unittest discover -p "test*.py" -v
      - name: Run legacy gateway pipeline suite
        run: python test_gateway.py
